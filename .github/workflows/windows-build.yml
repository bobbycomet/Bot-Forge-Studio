name: Build Windows exe

on:
  workflow_dispatch:            # Actions tab -> "Build Windows exe" -> Run workflow
  push:
    tags: ["v*"]                # pushing a tag like v1.0.0 also publishes a GitHub Release

permissions:
  contents: write               # needed only to attach files to a Release

jobs:
  windows:
    runs-on: windows-2022       # x64; the app runs on Windows 11 (the installer requires build 22000+)
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Inno Setup (installer builder)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          "${env:ProgramFiles(x86)}\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build (PyInstaller + selftest + installer)
        shell: pwsh
        env:
          # Optional code signing: add these as repository secrets. Without them the files are left unsigned.
          WIN_CERT_PFX_BASE64: ${{ secrets.WIN_CERT_PFX_BASE64 }}
          WIN_CERT_PASSWORD: ${{ secrets.WIN_CERT_PASSWORD }}
        run: ./packaging/build_windows.ps1

      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem dist -File | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Out-File dist\SHA256SUMS.txt -Encoding ascii

      - uses: actions/upload-artifact@v5
        with:
          name: BotForgeStudio-Windows11
          path: |
            dist/BotForgeStudio-*-Windows11-Setup.exe
            dist/BotForgeStudio-*-Windows11-portable.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Attach to GitHub Release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/BotForgeStudio-*-Windows11-Setup.exe
            dist/BotForgeStudio-*-Windows11-portable.zip
            dist/SHA256SUMS.txt
